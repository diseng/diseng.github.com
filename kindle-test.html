<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindle 兼容性测试</title>
<style>
  /* 墨水屏优化：纯黑白、高对比、大字体、无动画 */
  * { margin: 0; padding: 0; }
  body {
    font-family: serif;
    background: #fff;
    color: #000;
    padding: 20px;
    max-width: 700px;
    margin: 0 auto;
  }
  h1 { font-size: 24px; margin-bottom: 16px; border-bottom: 3px solid #000; padding-bottom: 8px; }
  .box {
    border: 3px solid #000;
    padding: 20px;
    margin-bottom: 16px;
  }
  .label { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
  .value { font-size: 48px; font-weight: bold; text-align: center; padding: 16px 0; }
  .ok   { background: #000; color: #fff; padding: 4px 10px; font-size: 20px; }
  .bad  { border: 3px solid #000; padding: 4px 10px; font-size: 20px; }
  button {
    width: 100%;
    min-height: 70px;
    font-size: 28px;
    font-weight: bold;
    background: #fff;
    color: #000;
    border: 4px solid #000;
    margin-bottom: 12px;
    cursor: pointer;
  }
  button:active { background: #000; color: #fff; }
  .step { font-size: 18px; line-height: 1.6; margin-bottom: 6px; }
  .small { font-size: 14px; color: #333; margin-top: 12px; }
</style>
</head>
<body>

<h1>Kindle 兼容性测试</h1>

<div class="box">
  <div class="label">1. localStorage 是否支持</div>
  <div id="supportStatus" class="value">检测中…</div>
</div>

<div class="box">
  <div class="label">2. 计数器（刷新页面后数字应保持不变）</div>
  <div id="counter" class="value">0</div>
  <button onclick="add()">点我 +1</button>
  <button onclick="resetCounter()">清零</button>
</div>

<div class="box">
  <div class="label">3. 上次写入时间（用于确认数据真的被保存了）</div>
  <div id="lastSaved" class="value" style="font-size:24px;">无记录</div>
</div>

<div class="box">
  <div class="label">测试步骤</div>
  <div class="step">① 点几次「点我 +1」</div>
  <div class="step">② 按 Kindle 浏览器的刷新（或关闭页面重新输入网址打开）</div>
  <div class="step">③ 数字没归零 → ✅ 通过</div>
  <div class="step">④ 再彻底退出浏览器重开一次，数字还在 → 持久化 OK</div>
  <div class="small" id="ua"></div>
</div>

<script>
// 全部使用 ES5 语法，兼容老 WebKit
var KEY_COUNT = 'kt_count';
var KEY_TIME  = 'kt_time';

function storageOK() {
  try {
    var k = '__kt_test__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    return true;
  } catch (e) {
    return false;
  }
}

function getItem(k) {
  try { return window.localStorage.getItem(k); } catch (e) { return null; }
}
function setItem(k, v) {
  try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; }
}

function show(id, text) {
  document.getElementById(id).innerHTML = text;
}

function render() {
  var c = getItem(KEY_COUNT);
  var t = getItem(KEY_TIME);
  show('counter', c === null ? '0' : c);
  show('lastSaved', t === null ? '无记录' : t);
}

function add() {
  var c = parseInt(getItem(KEY_COUNT) || '0', 10) + 1;
  var now = new Date();
  var ts = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate())
         + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  setItem(KEY_COUNT, String(c));
  setItem(KEY_TIME, ts);
  render();
}

function resetCounter() {
  setItem(KEY_COUNT, '0');
  render();
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }

// 页面加载时检测
if (storageOK()) {
  show('supportStatus', '<span class="ok">✔ 支持</span>');
} else {
  show('supportStatus', '<span class="bad">✘ 不支持</span>');
}
render();
show('ua', navigator.userAgent);
</script>

</body>
</html>
