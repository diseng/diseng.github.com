<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindle 兼容性测试 v2</title>
<style>
  * { margin: 0; padding: 0; }
  body {
    font-family: serif;
    background: #fff;
    color: #000;
    padding: 20px;
    max-width: 700px;
    margin: 0 auto;
  }
  h1 { font-size: 24px; margin-bottom: 16px; border-bottom: 3px solid #000; padding-bottom: 8px; }
  .box {
    border: 3px solid #000;
    padding: 20px;
    margin-bottom: 16px;
  }
  .label { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
  .value { font-size: 40px; font-weight: bold; text-align: center; padding: 10px 0; }
  .ok   { background: #000; color: #fff; padding: 4px 10px; font-size: 20px; }
  .bad  { border: 3px solid #000; padding: 4px 10px; font-size: 20px; }
  button {
    width: 100%;
    min-height: 70px;
    font-size: 28px;
    font-weight: bold;
    background: #fff;
    color: #000;
    border: 4px solid #000;
    margin-bottom: 12px;
    cursor: pointer;
  }
  button:active { background: #000; color: #fff; }
  .step { font-size: 18px; line-height: 1.6; margin-bottom: 6px; }
  .small { font-size: 14px; color: #333; margin-top: 12px; }
</style>
</head>
<body>

<h1>Kindle 兼容性测试 v2</h1>

<div class="box">
  <div class="label">A. localStorage 计数器</div>
  <div id="lsCounter" class="value">-</div>
</div>

<div class="box">
  <div class="label">B. WebSQL 计数器（重点测试项）</div>
  <div id="sqlSupport" class="label">检测中…</div>
  <div id="sqlCounter" class="value">-</div>
</div>

<div class="box">
  <div class="label">C. Cookie 计数器</div>
  <div id="cookieCounter" class="value">-</div>
</div>

<button onclick="addAll()">三个一起 +1</button>

<div class="box">
  <div class="label">测试步骤</div>
  <div class="step">① 点几次「三个一起 +1」</div>
  <div class="step">② <b>完全退出浏览器</b>（回到 Kindle 主页，按 Home 键）</div>
  <div class="step">③ 重新打开浏览器，输入网址回来</div>
  <div class="step">④ 哪个数字没归零，哪个就是可用的持久化方案</div>
  <div class="small" id="ua"></div>
</div>

<script>
// ===== A. localStorage =====
function lsGet() {
  try { return parseInt(window.localStorage.getItem('kt_ls') || '0', 10); } catch (e) { return -1; }
}
function lsSet(v) {
  try { window.localStorage.setItem('kt_ls', String(v)); } catch (e) {}
}

// ===== B. WebSQL =====
var db = null;
var sqlSupported = false;
try {
  if (window.openDatabase) {
    db = window.openDatabase('ktdb', '1.0', 'kt test', 1024 * 1024);
    sqlSupported = !!db;
  }
} catch (e) { sqlSupported = false; }

function sqlGet(cb) {
  if (!db) { cb(-1); return; }
  try {
    db.transaction(function (tx) {
      tx.executeSql('CREATE TABLE IF NOT EXISTS kv (k TEXT, v INTEGER)');
      tx.executeSql('SELECT v FROM kv WHERE k="c"', [], function (t, rs) {
        cb(rs.rows.length ? rs.rows.item(0).v : 0);
      }, function () { cb(-2); });
    });
  } catch (e) { cb(-3); }
}
function sqlSet(v) {
  if (!db) return;
  try {
    db.transaction(function (tx) {
      tx.executeSql('CREATE TABLE IF NOT EXISTS kv (k TEXT, v INTEGER)');
      tx.executeSql('DELETE FROM kv WHERE k="c"');
      tx.executeSql('INSERT INTO kv (k, v) VALUES ("c", ?)', [v]);
    });
  } catch (e) {}
}

// ===== C. Cookie =====
function cookieGet() {
  try {
    var m = document.cookie.match(/kt_ck=(\d+)/);
    return m ? parseInt(m[1], 10) : 0;
  } catch (e) { return -1; }
}
function cookieSet(v) {
  try {
    document.cookie = 'kt_ck=' + v + '; expires=Tue, 19 Jan 2038 03:14:07 GMT; path=/';
  } catch (e) {}
}

// ===== 渲染 =====
function show(id, text) { document.getElementById(id).innerHTML = text; }

function render() {
  show('lsCounter', lsGet());
  show('cookieCounter', cookieGet());
  show('sqlSupport', sqlSupported
    ? '<span class="ok">✔ 浏览器支持 WebSQL</span>'
    : '<span class="bad">✘ 不支持 WebSQL</span>');
  sqlGet(function (v) { show('sqlCounter', v < 0 ? '出错' : v); });
}

function addAll() {
  lsSet(lsGet() + 1);
  cookieSet(cookieGet() + 1);
  sqlGet(function (v) {
    sqlSet((v < 0 ? 0 : v) + 1);
    // 延迟渲染，等 WebSQL 写完
    setTimeout(render, 300);
  });
  render();
}

render();
show('ua', navigator.userAgent);
</script>

</body>
</html>
