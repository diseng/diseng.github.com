<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日任务打卡</title>
<style>
  /* Kindle PW3 墨水屏优化：纯黑白、高对比、大字体、无动画、无Flexbox */
  * { margin: 0; padding: 0; }
  body {
    font-family: serif;
    background: #fff;
    color: #000;
    padding: 8px;
  }
  .header {
    border-bottom: 4px solid #000;
    padding-bottom: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .header .title { font-size: 30px; font-weight: bold; float: left; }
  .header .clock { font-size: 24px; float: right; padding-top: 6px; }
  .tabs { margin-bottom: 12px; overflow: hidden; }
  .tab {
    display: block;
    float: left;
    width: 48%;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    padding: 10px 0;
    border: 3px solid #000;
    background: #fff;
    color: #000;
    cursor: pointer;
  }
  .tab.active { background: #000; color: #fff; }
  .tab.right { float: right; }
  .group-title {
    font-size: 22px;
    font-weight: bold;
    border-bottom: 2px solid #000;
    margin: 10px 0 6px 0;
    padding-bottom: 2px;
  }
  .tiles { overflow: hidden; }
  .task {
    display: block;
    float: left;
    width: 49%;
    height: 130px;
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    padding-top: 46px;
    margin-bottom: 8px;
    background: #fff;
    color: #000;
    border: 4px solid #000;
    cursor: pointer;
    font-family: serif;
    overflow: hidden;
  }
  .task.tr { float: right; }
  .task .mark { font-size: 32px; }
  .task.done {
    background: #000;
    color: #fff;
  }
  .progress {
    font-size: 26px;
    font-weight: bold;
    text-align: center;
    padding: 10px;
    border: 3px solid #000;
    margin-bottom: 10px;
  }
  .progress .big { font-size: 40px; }
  .hrow {
    border: 2px solid #000;
    padding: 10px;
    margin-bottom: 6px;
    font-size: 26px;
    font-weight: bold;
    overflow: hidden;
    white-space: nowrap;
  }
  .hrow .d { display: inline-block; width: 22%; }
  .hrow .bar {
    display: inline-block;
    width: 34%;
    height: 24px;
    border: 2px solid #000;
    vertical-align: middle;
    margin: 0 3%;
  }
  .hrow .bar i {
    display: block;
    height: 100%;
    background: #000;
  }
  .hrow .s { display: inline-block; width: 16%; text-align: center; }
  .hrow .c { display: inline-block; width: 16%; text-align: right; }
  .empty { font-size: 22px; text-align: center; padding: 30px 0; }
  .quote {
    border: 4px solid #000;
    height: 92px;
    margin-top: 6px;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    padding-top: 26px;
    line-height: 1.4;
  }
  .note { font-size: 16px; color: #333; margin-top: 10px; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <span class="title">每日任务打卡</span>
  <span class="clock" id="clock">--</span>
</div>

<div class="tabs">
  <a class="tab active" id="tabToday" onclick="showTab('today')">今日打卡</a>
  <a class="tab right" id="tabHistory" onclick="showTab('history')">历史记录</a>
</div>

<div class="progress" id="progress" style="display:none;"></div>
<div id="main"></div>
<div class="note">每天早上 7:00 自动存档并重置</div>

<script>
/* ================= 配置 ================= */
var RESET_HOUR = 7;           // 每天重置时间：早上7点
var KEEP_DAYS  = 90;          // 历史保留天数
var GROUPS = [
  { name: '每日必做', tasks: ['户外活动', '学校作业+书包整理'] },
  { name: '身体健康', tasks: ['早晚反转拍练习', '靠墙拉筋板10分钟', '扶墙垫脚3组每组30次', '单杠2次', '眼药水', '擦香'] },
  { name: '日常习惯', tasks: ['阅读', '英语听力'] }

/* 展平成10个任务 */
var TASKS = [];
(function () {
  for (var g = 0; g < GROUPS.length; g++) {
    for (var i = 0; i < GROUPS[g].tasks.length; i++) {
      TASKS.push(GROUPS[g].tasks[i]);
    }
  }
})();
var TASK_COUNT = TASKS.length;

/* 每项分值（与 TASKS 顺序一一对应），每日必做2项记0分但作为记分门槛，满分10分 */
var SCORES = [0, 0, 1, 1, 1, 1, 1, 1, 2, 2];
var MAX_SCORE = 10;

/* 每日一句（搞笑版），按日期轮换 */
var QUOTES = [

  '今天你打卡了吗？打了！漂亮！',

  '你是打卡界的小天才！',
  '坚持一下，惊喜在后头！',
  '每一天都在偷偷变优秀！',
  '别停，优秀正在路上！',
  '小小打卡，藏着大大的未来！',
  '今日打卡，明日开挂！',
  '全勤小标兵，就是你！',
  '打卡结束，今天的你真了不起！'

/* 计算得分：每日必做2项未完成则0分 */
function scoreOf(fl) {
  if (fl.charAt(0) !== '1' || fl.charAt(1) !== '1') return 0;
  var s = 0;
  for (var i = 0; i < TASK_COUNT; i++) {
    if (fl.charAt(i) === '1') s += SCORES[i];
  }
  return s;
}

/* ================= Cookie 工具 ================= */
function setCookie(k, v) {
  document.cookie = k + '=' + encodeURIComponent(v) +
    '; expires=Tue, 19 Jan 2038 03:14:07 GMT; path=/';
}
function getCookie(k) {
  var pairs = document.cookie.split('; ');
  for (var i = 0; i < pairs.length; i++) {
    var eq = pairs[i].indexOf('=');
    if (eq > 0 && pairs[i].substring(0, eq) === k) {
      return decodeURIComponent(pairs[i].substring(eq + 1));
    }
  }
  return null;
}
function delCookie(k) {
  document.cookie = k + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
}
function allHistoryCookies() {
  var out = [];
  var pairs = document.cookie.split('; ');
  for (var i = 0; i < pairs.length; i++) {
    var eq = pairs[i].indexOf('=');
    if (eq > 0) {
      var k = pairs[i].substring(0, eq);
      if (k.indexOf('dt_h_') === 0) {
        out.push({ key: k, val: decodeURIComponent(pairs[i].substring(eq + 1)) });
      }
    }
  }
  return out;
}

/* 日期工具 */
function pad(n) { return n < 10 ? '0' + n : '' + n; }
/* 强制按中国时区（UTC+8）取时间，避免设备时区设置不对导致显示错误 */
function nowCN() {
  var n = new Date();
  return new Date(n.getTime() + (n.getTimezoneOffset() + 480) * 60000);
}
function ymd(d) {
  return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
}
/* "任务日"：凌晨0点到7点之间仍算前一天 */
function taskDay(now) {
  var d = new Date(now.getTime());
  if (d.getHours() < RESET_HOUR) {
    d.setDate(d.getDate() - 1);
  }
  return ymd(d);
}
function intYmd(s) { return parseInt(s, 10); }

/* ================= 状态 ================= */
var flags = '';               // 10位 0/1
var currentTab = 'today';

function zeroFlags() {
  var s = '';
  for (var i = 0; i < TASK_COUNT; i++) s += '0';
  return s;
}

/* 归档某一天：把 yyyymmdd 的 flags 写入对应月份 Cookie */
function archive(dateStr, fl) {
  var monthKey = 'dt_h_' + dateStr.substring(2, 6);   // dt_h_2610
  var day = dateStr.substring(6, 8);                   // 24
  var val = getCookie(monthKey);
  var entries = {};
  if (val) {
    var parts = val.split(',');
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split(':');
      if (kv.length === 2) entries[kv[0]] = kv[1];
    }
  }
  entries[day] = fl;
  var out = [];
  for (var k in entries) { out.push(k + ':' + entries[k]); }
  setCookie(monthKey, out.join(','));
  prune();
}

/* 清理 KEEP_DAYS 之前的历史 */
function prune() {
  var cutoff = nowCN();
  cutoff.setDate(cutoff.getDate() - KEEP_DAYS);
  var cutoffInt = intYmd(ymd(cutoff));
  var list = allHistoryCookies();
  for (var i = 0; i < list.length; i++) {
    var ym = '20' + list[i].key.substring(5);          // dt_h_2610 -> 202610
    var parts = list[i].val.split(',');
    var kept = [];
    for (var j = 0; j < parts.length; j++) {
      var kv = parts[j].split(':');
      if (kv.length === 2 && intYmd(ym + kv[0]) >= cutoffInt) {
        kept.push(parts[j]);
      }
    }
    if (kept.length) {
      setCookie(list[i].key, kept.join(','));
    } else {
      delCookie(list[i].key);
    }
  }
}

/* 检查是否跨过了任务日：跨了就归档旧状态并重置 */
function tick() {
  var today = taskDay(nowCN());
  var stored = getCookie('dt_today');                  // "yyyymmdd:flags"
  if (!stored || stored.split(':')[0] !== today) {
    if (stored) {
      var kv = stored.split(':');
      if (kv[1] !== zeroFlags()) archive(kv[0], kv[1]); // 全0的空记录不存档
    }
    flags = zeroFlags();
    setCookie('dt_today', today + ':' + flags);
    render();   // 重置后立即刷新界面
  } else {
    flags = stored.split(':')[1];
    if (flags.length !== TASK_COUNT) flags = zeroFlags();
  }
  updateClock();
}

function save() {
  setCookie('dt_today', taskDay(nowCN()) + ':' + flags);
}

/* ================= 交互 ================= */
function toggle(i) {
  flags = flags.substring(0, i) + (flags.charAt(i) === '1' ? '0' : '1') + flags.substring(i + 1);
  save();
  render();
}
function showTab(t) {
  currentTab = t;
  document.getElementById('tabToday').className = 'tab' + (t === 'today' ? ' active' : '');
  document.getElementById('tabHistory').className = 'tab right' + (t === 'history' ? ' active' : '');
  render();
}

/* ================= 渲染 ================= */
function updateClock() {
  var n = nowCN();
  var week = ['日', '一', '二', '三', '四', '五', '六'][n.getDay()];
  document.getElementById('clock').innerHTML =
    pad(n.getMonth() + 1) + '-' + pad(n.getDate()) + ' 周' + week;
}

function render() {
  var html = '';
  var progress = document.getElementById('progress');
  if (currentTab === 'today') {
    var done = 0, i;
    for (i = 0; i < TASK_COUNT; i++) if (flags.charAt(i) === '1') done++;
    var score = scoreOf(flags);
    var gated = flags.charAt(0) === '1' && flags.charAt(1) === '1';
    progress.style.display = 'block';
    progress.innerHTML = '今日得分 <span class="big">' + score + '</span>，' +
      '已完成任务 <span class="big">' + done + '/' + TASK_COUNT + '</span>' +
      (!gated ? '<div style="font-size:20px;margin-top:6px;">⚠ 「每日必做」未完成，暂不计分</div>' : '') +
      (done === TASK_COUNT ? '<div style="font-size:28px;margin-top:6px;">★ 全部完成，真棒！ ★</div>' : '');
    var idx = 0;
    for (var g = 0; g < GROUPS.length; g++) {
      html += '<div class="group-title">【' + GROUPS[g].name + '】</div><div class="tiles">';
      for (var t = 0; t < GROUPS[g].tasks.length; t++) {
        (function (index, name, pos) {
          var isDone = flags.charAt(index) === '1';
          html += '<button class="task' + (pos % 2 ? ' tr' : '') + (isDone ? ' done' : '') +
            '" onclick="toggle(' + index + ')">' +
            '<span class="mark">' + (isDone ? '✔ ' : '○ ') + '</span>' + name + '</button>';
        })(idx, GROUPS[g].tasks[t], t);
        idx++;
      }
      html += '</div>';
    }
    /* 底部鼓励语：按日期轮换 */
    var dayInt = parseInt(taskDay(nowCN()), 10);
    html += '<div class="quote">' + QUOTES[dayInt % QUOTES.length] + '</div>';
  } else {
    progress.style.display = 'none';
    html = renderHistory();
  }
  document.getElementById('main').innerHTML = html;
}

function renderHistory() {
  var days = {};   // yyyymmdd -> flags
  var list = allHistoryCookies();
  var i, j;
  for (i = 0; i < list.length; i++) {
    var ym = '20' + list[i].key.substring(5);
    var parts = list[i].val.split(',');
    for (j = 0; j < parts.length; j++) {
      var kv = parts[j].split(':');
      if (kv.length === 2) days[ym + kv[0]] = kv[1];
    }
  }
  /* 把今天还没归档的也加进去显示 */
  var stored = getCookie('dt_today');
  if (stored) {
    var kv2 = stored.split(':');
    if (kv2.length === 2 && kv2[1] !== zeroFlags()) days[kv2[0]] = kv2[1];
  }
  var keys = [];
  for (var k in days) keys.push(k);
  if (!keys.length) {
    return '<div class="empty">还没有历史记录</div>';
  }
  keys.sort();
  keys.reverse();
  var html = '';
  for (i = 0; i < keys.length; i++) {
    var fl = days[keys[i]];
    var cnt = 0;
    for (j = 0; j < fl.length; j++) if (fl.charAt(j) === '1') cnt++;
    var pct = Math.round(cnt * 100 / TASK_COUNT);
    html += '<div class="hrow">' +
      '<span class="d">' + keys[i].substring(4, 6) + '-' + keys[i].substring(6, 8) + '</span>' +
      '<span class="bar"><i style="width:' + pct + '%;"></i></span>' +
      '<span class="s">' + scoreOf(fl) + '分</span>' +
      '<span class="c">' + cnt + '/' + TASK_COUNT + '</span>' +
      '</div>';
  }
  return html;
}

/* ================= 启动 ================= */
tick();
render();
/* 每小时检查一次是否跨过早上7点（跨了就归档并重置） */
setInterval(tick, 3600000);
</script>

</body>
</html>
